name: makken-prod

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Required}
      MYSQL_USER: ${MYSQL_USER:?Required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: makken.production_settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Required}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Required}
      MYSQL_USER: ${MYSQL_USER:?Required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - /var/lib/makken/private_uploads:/app/private_uploads
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; request = urllib.request.Request("http://127.0.0.1:8000/admin/login/", headers={"X-Forwarded-Proto": "https"}); urllib.request.urlopen(request, timeout=5)
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:

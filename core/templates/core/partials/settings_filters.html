<section class="settings-filters-card" aria-label="البحث والتصفية">
  <form method="get" action="{{ request.path }}" class="settings-filters" role="search">
    <div class="settings-filters-search"><label for="settings-filter-q">البحث في السجل</label><div class="settings-filters-input-wrap"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="settings-filter-q" name="q" type="search" maxlength="200" value="{{ settings_filter_q }}" placeholder="ابحث في أي معلومة بالجدول…" autocomplete="off"></div></div>
    <div class="settings-filters-status"><label for="settings-filter-status">حالة السجل</label><select id="settings-filter-status" name="status"><option value="">جميع الحالات</option><option value="1"{% if settings_filter_status == '1' %} selected{% endif %}>نشط</option><option value="0"{% if settings_filter_status == '0' %} selected{% endif %}>غير نشط</option></select></div>
    <button class="button button-primary settings-filters-submit" type="submit">بحث</button><a class="button button-secondary settings-filters-reset" href="{{ request.path }}">مسح</a>
  </form>
  {% if settings_filter_active %}<p class="settings-filters-summary" role="status">نتائج البحث: <strong>{{ page_obj.paginator.count }}</strong>{% if settings_filter_q %} · «<bdi>{{ settings_filter_q }}</bdi>»{% endif %}{% if settings_filter_status == '1' %} · السجلات النشطة{% elif settings_filter_status == '0' %} · السجلات غير النشطة{% endif %}</p>{% endif %}
</section>

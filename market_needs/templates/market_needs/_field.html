<div class="partnership-field{% if wide %} market-wide{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required" aria-hidden="true">*</span>{% endif %}</label>{{ field }}<div class="field-error" id="error-{{ field.name }}" role="alert">{{ field.errors }}</div></div>

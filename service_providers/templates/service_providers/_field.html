{% load static %}
<div class="partnership-field{% if wide %} provider-wide{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required" aria-hidden="true">*</span>{% endif %}</label>{% if field.name == 'financial_capacity' %}<div class="market-money-input">{{ field }}<img src="{% static 'partnerships/saudi-riyal.svg' %}" alt="ريال سعودي" width="18" height="18"></div>{% else %}{{ field }}{% endif %}<div class="field-error" id="error-{{ prefix|default:'provider' }}-{{ field.name }}" role="alert">{{ field.errors }}</div></div>
